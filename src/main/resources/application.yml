server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: clinical-service
          uri: http://localhost:8083
          predicates:
            - Path=/records/**

        - id: appointment-service
          uri: http://localhost:8081
          predicates:
            - Path=/appointments/**

        - id: identity-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**, /doctors/**, /patients/**